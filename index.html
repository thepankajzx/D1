<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Primary Manifest & Meta -->
    <link rel="manifest" href="/manifest.json?v=14" />
    <meta name="theme-color" content="#f7faf8" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Definite" />

    <!-- iOS / Apple Specific PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Definite" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=14" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=14" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=14" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=14" />
    <link rel="shortcut icon" href="/favicon.ico?v=14" />

    <!-- Descriptions & OpenGraph -->
    <meta name="description" content="Understand your habits, not just track them." />
    <meta property="og:title" content="Definite - Habit Intelligence" />
    <meta property="og:description" content="Understand your habits, not just track them." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Preconnects & Non-Blocking Asynchronous Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" onload="this.onload=null;this.rel='stylesheet'"/>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600&display=swap"/>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    </noscript>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html.dark, html.dark body {
        background-color: #0f141c !important;
        color: #f8fafc !important;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #f7faf8 !important;
        color: #0f172a !important;
      }
    </style>
    
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark'; // Day mode by default!
          var meta = document.getElementById('meta-theme-color');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f141c';
            document.documentElement.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#0f141c');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f7faf8';
            document.documentElement.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#f7faf8');
          }
        } catch (e) {}
      })();
    </script>
    
    <title>Definite - Habit Intelligence</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Definite.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
